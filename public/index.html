<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAI · Balance Mastersheet</title>
<style>
  :root { --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#223042; --text:#e6edf3; --muted:#8b9bb0; --accent:#71f7ec; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  .sandbox { background:repeating-linear-gradient(45deg,#3a2a00,#3a2a00 10px,#2d2100 10px,#2d2100 20px); color:#ffd56b; text-align:center; font-size:12px; padding:4px 12px; font-weight:600; letter-spacing:.3px; }
  header { display:flex; align-items:center; gap:10px; padding:10px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { margin:0; font-size:17px; } header h1 b { color:var(--accent); }
  .sp { flex:1; }
  .clock { display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 6px 4px 10px; flex-wrap:wrap; }
  .clock b { font-variant-numeric:tabular-nums; font-size:15px; }
  button { background:#1b2533; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#04211f; border-color:var(--accent); font-weight:600; }
  button.on { background:#0e3b37; border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; } button.sm { padding:3px 8px; font-size:12px; }
  input, select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font:inherit; }
  main { padding:16px 20px 60px; max-width:1560px; margin:auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-bottom:12px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 12px; }
  .kpi .l { color:var(--muted); font-size:12px; } .kpi .v { font-size:18px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
  .kpi .d { font-size:11px; color:var(--muted); }
  .formula { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:12px; color:var(--muted); margin-bottom:12px; display:flex; gap:22px; flex-wrap:wrap; }
  .formula b { color:var(--warn); }
  nav { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap; }
  nav a { padding:7px 11px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-size:13px; }
  nav a.on { color:var(--text); border-color:var(--accent); }
  section { display:none; } section.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:14px; } .card h4 { margin:12px 0 6px; font-size:13px; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tw { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; } th { color:var(--muted); font-weight:500; font-size:12px; }
  td.n, th.n { text-align:right; } td.wrap { white-space:normal; min-width:320px; } tr.tot td { font-weight:700; border-top:2px solid var(--line); } tr.sub td { color:var(--muted); }
  tr.open td { background:#0f1d1c; } tr.day td { background:#101824; color:var(--blue); font-weight:600; } tr.warn td { background:#1f1a0c; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; border:1px solid var(--line); }
  .tag.ok { color:var(--ok); border-color:#2a5d34; } .tag.warn { color:var(--warn); border-color:#5c4613; } .tag.bad { color:var(--bad); border-color:#6b2420; } .tag.reap { color:var(--accent); border-color:#1d4b47; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:12px; }
  .bar { height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; display:flex; margin:8px 0; } .bar i { display:block; height:100%; } .bar .s { background:var(--accent); } .bar .r { background:var(--warn); }
  .prod { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:12px; }
  .prod .p { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:4px; }
  .prod img { width:100%; height:100px; object-fit:contain; background:#fff; border-radius:6px; }
  .steps9 { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:12px; }
  .stepc { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .stepc .hd { display:flex; gap:8px; align-items:center; } .stepc .num { background:var(--accent); color:#04211f; border-radius:99px; width:24px; height:24px; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
  .stepc .hd b { font-size:14px; } .stepc .desc { font-size:12px; color:var(--muted); }
  .stepc .metric { display:flex; justify-content:space-between; font-size:13px; } .stepc .metric span:last-child { font-variant-numeric:tabular-nums; font-weight:600; }
  .stepc .reap { font-size:12px; background:#0e2a28; border:1px solid #1d4b47; border-radius:8px; padding:6px 8px; color:#bff; }
  .stepc .je { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--muted); background:var(--panel2); border-radius:6px; padding:5px 7px; }
  .stepc .last { font-size:11px; color:var(--muted); border-top:1px dashed var(--line); padding-top:5px; }
  .chat { display:flex; flex-direction:column; gap:10px; max-height:520px; overflow:auto; margin-bottom:10px; }
  .msg { padding:10px 12px; border-radius:10px; white-space:pre-wrap; max-width:88%; }
  .msg.user { background:#1b2533; align-self:flex-end; } .msg.assistant { background:#0e2a28; border:1px solid #1d4b47; }
  .stepsx { font-size:11px; color:var(--muted); margin-top:6px; }
  #toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--accent); padding:10px 14px; border-radius:10px; display:none; max-width:480px; white-space:pre-wrap; z-index:10; }
  a.ext { color:var(--accent); }
  .chk { display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); }
  .pill { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
  .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .banner { border:1px solid var(--warn); background:#1f1a0c; color:#ffd56b; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:13px; }
  .banner.ok { border-color:#2a5d34; background:#0d1f12; color:#9be9a8; }
</style>
</head>
<body>
<div class="sandbox" data-i="sandboxBanner"></div>
<header>
  <h1><b>CAI</b> · <span data-i="title"></span></h1>
  <span class="sp"></span>
  <div class="clock">
    <span class="small muted" data-i="businessDate"></span> <b id="asof"></b>
    <button class="sm" data-adv="1">+1d</button><button class="sm" data-adv="7">+7d</button><button class="sm" data-adv="31" data-i="toMonthEnd"></button>
    <button class="sm" id="autoBtn">▶ Autopilot</button>
    <button class="sm primary" id="closeBtn" data-i="closeMonth"></button>
  </div>
  <span class="small muted" id="queueInfo"></span>
  <button id="lang">ES</button>
  <button id="reset" data-i="reset"></button>
</header>
<main>
  <div id="cardBanner"></div>
  <div class="kpis" id="kpis"></div>
  <div class="formula"><span><b data-i="coreFormula"></b> <span data-i="arFormula"></span></span><span><b data-i="cashFormula"></b> <span data-i="cashFormulaTxt"></span></span></div>
  <nav id="tabs"></nav>

  <section id="cfo">
    <div class="grid" id="cfoQ"></div>
    <div class="grid2">
      <div class="card"><h3 id="hDec"></h3><div id="cfoDec"></div></div>
      <div class="card"><h3 id="hNar"></h3><div id="cfoNar"></div><h4 id="hEcl"></h4><div id="cfoEcl"></div></div>
    </div>
    <div class="card tw"><h3 id="hKpi"></h3><table id="kpiTable"></table></div>
    <div class="card tw"><h3 id="h13"></h3><table id="w13Table"></table></div>
    <div class="grid2">
      <div class="card tw"><h3 id="hAg"></h3><table id="agTable"></table></div>
      <div class="card tw"><h3 id="hRep"></h3><table id="repTable"></table></div>
    </div>
    <div class="card small muted" id="cfoRule"></div>
  </section>

  <section id="process">
    <div class="card small muted" data-i="processIntro"></div>
    <div class="steps9" id="steps9"></div>
  </section>

  <section id="master">
    <div class="card tw"><h3 data-i="mastersheet"></h3><table id="msTable"></table></div>
    <div class="grid">
      <div class="card"><h3 data-i="forecast"></h3><div id="forecast"></div></div>
      <div class="card"><h3 data-i="closeChecklist"></h3><div id="checklist"></div></div>
    </div>
  </section>

  <section id="ops">
    <div class="card row">
      <select id="opStep"></select>
      <select id="opLevel"><option value="">All levels</option><option>INFO</option><option>WARN</option></select>
      <input id="opQ" size="30" data-ph="filter">
      <span class="small muted" data-i="opsHint"></span>
    </div>
    <div class="card tw"><table id="opsTable"></table></div>
  </section>

  <section id="fs">
    <div class="card row"><span data-i="period"></span> <select id="fsMonth"></select> <span class="small muted" id="fsAsOf"></span></div>
    <div class="grid2">
      <div class="card tw"><h3 data-i="incomeStatement"></h3><table id="isTable"></table></div>
      <div class="card tw"><h3 data-i="balanceSheet"></h3><table id="bsTable"></table></div>
      <div class="card tw"><h3 data-i="cashFlowSt"></h3><table id="cfTable"></table></div>
      <div class="card tw"><h3 data-i="trialBalance"></h3><table id="tbTable"></table></div>
    </div>
  </section>

  <section id="arr">
    <div class="card tw"><h3 data-i="agingTitle"></h3><table id="agingTable"></table></div>
    <div class="card tw"><h3 data-i="rollforward"></h3><table id="rfTable"></table></div>
    <div class="card tw"><h3 data-i="custStatement"></h3><div class="row"><select id="stCust"></select></div><div id="stBody" style="margin-top:10px"></div></div>
  </section>

  <section id="orders">
    <div class="card">
      <h3 data-i="newOrder"></h3>
      <div class="row">
        <select id="oCust"></select>
        <input id="oDesc" size="24" data-ph="description">
        <select id="oType"><option>GOODS</option><option>SERVICE</option></select>
        <input id="oAmt" type="number" min="0" style="width:120px" data-ph="amountUsd">
        <input id="oDate" type="date"> <input id="oEnd" type="date" title="service end">
        <button class="primary" id="oCreate" data-i="bookOrder"></button>
      </div>
      <div class="small muted" style="margin-top:6px" data-i="orderHint"></div>
    </div>
    <div class="card tw"><table id="ordTable"></table></div>
    <div class="card tw"><h3 data-i="revRecon"></h3><table id="revTable"></table></div>
  </section>

  <section id="ar">
    <div class="card row"><button class="primary" id="collect" data-i="runCycle"></button><span class="muted small" data-i="runCycleHint"></span></div>
    <div class="card tw"><h3 data-i="priority"></h3><table id="prioTable"></table></div>
    <div class="card tw"><h3 data-i="invoices"></h3><table id="arTable"></table></div>
  </section>

  <section id="cashapp"><div class="card tw"><table id="cashTable"></table></div></section>

  <section id="treasury">
    <div class="grid" id="budgets"></div>
    <div class="card tw"><h3 data-i="allocations"></h3><table id="allocTable"></table></div>
  </section>

  <section id="spend">
    <div class="card tw"><h3 data-i="recurringTitle"></h3><div class="small muted" style="margin-bottom:8px" data-i="recurringHint"></div><table id="recTable"></table></div>
    <div class="card">
      <h3 data-i="vendorCatalog"></h3>
      <div class="row"><select id="cc"></select><input id="vq" size="24" data-ph="filter"><input id="qty" type="number" min="1" value="1" style="width:64px"><span class="muted small" data-i="spendHint"></span></div>
      <div class="prod" id="vendors"></div>
    </div>
    <div class="card">
      <h3 data-i="catalogSearch"></h3>
      <div class="row"><input id="q" size="28" value="office chair"><button id="search" data-i="search"></button><span class="muted small" data-i="searchHint"></span></div>
      <div class="prod" id="results"></div>
    </div>
  </section>

  <section id="ap">
    <div class="card tw"><h3 data-i="purchases"></h3><table id="purTable"></table></div>
    <div class="card tw"><h3 data-i="apBills"></h3><table id="apTable"></table></div>
  </section>

  <section id="journal"><div class="card tw"><table id="jeTable"></table></div></section>

  <section id="sox">
    <div class="card tw"><h3 data-i="soxTitle"></h3><table id="soxTable"></table></div>
    <div class="card tw"><h3 data-i="reconTitle"></h3><table id="reconTable"></table></div>
    <div class="card tw"><h3 data-i="exceptions"></h3><table id="excTable"></table></div>
  </section>

  <section id="agent">
    <div class="card">
      <div class="small muted" style="margin-bottom:8px" data-i="agentIntro"></div>
      <div class="chat" id="chat"></div>
      <div class="row"><input id="ask" style="flex:1" data-ph="askPh"><button class="primary" id="send" data-i="send"></button></div>
      <div class="row small" style="margin-top:8px" id="suggest"></div>
    </div>
  </section>

  <section id="audit"><div class="card tw"><table id="auditTable"></table></div></section>

  <section id="setup">
    <div class="card">
      <h3 data-i="setupTitle"></h3>
      <p class="muted" data-i="setupBody"></p>
      <div id="enroll"></div>
      <div class="row" style="margin-top:12px"><input id="enrollId" size="40" data-ph="enrollPh"><button id="useEnroll" data-i="useEnroll"></button></div>
      <p class="small muted" id="simNote"></p>
    </div>
  </section>
</main>
<div id="toast"></div>

async function advance(days, btn) {
  const r = await api('/api/advance', { days });
  await refresh();
  if (btn !== 'auto') { const s = r.days.reduce((a, x) => ({ b: a.b + x.billed.length, c: a.c + x.collectedCents, p: a.p + x.paid.length }), { b: 0, c: 0, p: 0 }); toast(`${t('advanced')} ${r.asOf}\n🧾 ${s.b} · 💰 ${money(s.c)} · 📤 ${s.p} · ⚡ Reap ${r.reapQueued}`); }
  return r;
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('button, a[data-tab]');
  if (!el) return;
  const d = el.dataset;
  if (d.tab || d.goto) { tab = d.tab || d.goto; location.hash = tab; render(); }
  if (d.adv) busy(el, () => advance(+d.adv));
  if (d.act) busy(el, async () => { const p = await api('/api/purchases/' + d.act, { id: d.id }); await refresh(); toast(`${p.id}: ${p.status}`); });
  if (d.sku) busy(el, async () => { const p = await api('/api/purchases', { costCenter: $('cc').value, vendorSku: d.sku, quantity: Number($('qty').value) || 1, reason: 'Operator request' }); await refresh(); toast(`${p.productName}\n${p.id}: ${p.status} — ${money(p.chargedCents ?? p.totalCents)}${p.rejectReason ? '\n' + p.rejectReason : ''}${p.blocked ? '\n' + t('blocked') : ''}${p.je ? '\n' + p.je : ''}`); });
  if (d.variant) busy(el, async () => { const p = await api('/api/purchases', { costCenter: $('cc').value, variantId: d.variant, productName: d.name, merchant: d.merchant, quantity: 1, reason: 'Catalog quote' }); await refresh(); toast(`${p.id}: ${money(p.totalCents)} — ${p.rejectReason || p.status}`); });
  if (d.hold) busy(el, async () => { await api('/api/credit-hold', { customerId: d.hold, hold: d.v === 'true' }); await refresh(); });
  if (d.ptp) busy(el, async () => { const dt = new Date(Date.parse(S.asOf) + 7 * 864e5).toISOString().slice(0, 10); await api('/api/promise', { invoiceId: d.ptp, date: dt }); await refresh(); });
  if (d.cn) busy(el, async () => { await api('/api/credit-note', { invoiceId: d.cn, reason: 'Dispute settlement' }); await refresh(); });
  if (d.reval) busy(el, async () => { await api('/api/orders/revalidate', { id: d.reval }); await refresh(); });
  if (d.resolve) busy(el, async () => { await api('/api/exceptions/resolve', { id: d.resolve, note: 'Reviewed by controller' }); await refresh(); });
  if (d.rrun) busy(el, async () => { const r = await api('/api/recurring/run', { id: d.rrun }); await refresh(); toast(`${r.id}: ${r.runs.at(-1)?.status || '—'}`); });
  if (d.rtog) busy(el, async () => { await api('/api/recurring/toggle', { id: d.rtog, active: d.v === 'true' }); await refresh(); });
  if (d.suggest) { $('ask').value = d.suggest; $('send').click(); }
  if (d.ecl) busy(el, async () => { await api('/api/ecl/approve', { id: d.ecl }); await refresh(); toast('ASC 326 ok'); });
  if (el.id === 'eclPropose') busy(el, async () => { await api('/api/ecl/propose', {}); await refresh(); });
  if (el.id === 'enrollStart') busy(el, async () => { const e = await api('/api/enrollment', {}); if (e.nextAction?.url) window.open(e.nextAction.url, '_blank'); await refresh(); });
  if (el.id === 'enrollRefresh') busy(el, async () => { await api('/api/enrollment/refresh', {}); await refresh(); });
});

$('useEnroll').onclick = e => busy(e.target, async () => { await api('/api/enrollment/use', { enrollmentId: $('enrollId').value.trim() }); await refresh(); });
$('oCreate').onclick = e => busy(e.target, async () => { const type = $('oType').value, date = $('oDate').value; const o = await api('/api/orders', { customerId: $('oCust').value, description: $('oDesc').value, type, amountCents: Math.round(Number($('oAmt').value) * 100), deliveryDate: type === 'GOODS' ? date : null, serviceStart: type === 'SERVICE' ? date : null, serviceEnd: type === 'SERVICE' ? $('oEnd').value : null }); await refresh(); toast(`${o.id}: ${o.status}${o.validation?.length ? '\n' + o.validation.join(', ') : ''}`); });
$('search').onclick = e => busy(e.target, async () => { const r = await api('/api/search', { query: $('q').value }); $('results').innerHTML = r.map(p => `<div class="p"><img src="${esc(p.imageUrl)}" alt=""><div>${esc(p.name)}</div><div class="small muted">${esc(p.merchant)}</div><div class="row" style="justify-content:space-between;margin-top:auto"><b>${money(p.unitCents)}</b><button class="sm" data-variant="${p.variantId}" data-name="${esc(p.name)}" data-merchant="${esc(p.merchant)}">${t('quote')}</button></div></div>`).join('') || '<span class="muted">—</span>'; });
$('send').onclick = e => busy(e.target, async () => { const q = $('ask').value.trim(); if (!q) return; chatLog.push({ role: 'user', content: q }); $('ask').value = ''; render(); const r = await api('/api/agent', { lang, messages: chatLog.map(({ role, content }) => ({ role, content })) }); chatLog.push({ role: 'assistant', content: r.text, steps: r.steps }); await refresh(); });
$('ask').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });

function stopAuto() { if (auto) { clearInterval(auto); auto = null; } $('autoBtn').classList.remove('on'); $('autoBtn').textContent = '▶ Autopilot'; }
$('autoBtn').onclick = () => {
  if (auto) return stopAuto();
  $('autoBtn').classList.add('on'); $('autoBtn').textContent = '⏸ Autopilot';
  let inflight = false;
  auto = setInterval(async () => {
    if (inflight) return; inflight = true;
    try { const r = await advance(1, 'auto'); if (r.atMonthEnd) { stopAuto(); toast(lang === 'es' ? 'Fin de mes — revisa el checklist y cierra.' : 'Month end — review the checklist and close.'); } }
    catch (e) { stopAuto(); toast('⚠ ' + e.message); } finally { inflight = false; }
  }, 2500);
};

refresh().catch(e => toast(e.message));
setInterval(() => {
  if (!S || document.hidden || auto) return;
  const waiting = (S.enrollment && S.enrollment.status !== 'ACTIVE') || S.purchases.some(p => ['REQUIRES_ACTION', 'PROCESSING'].includes(p.status)) || S.reapQueue.pending || S.reapQueue.running;
  if (waiting) refresh().catch(() => {});
}, 4000);
</script>
</body>
</html>
